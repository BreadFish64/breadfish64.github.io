<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv="Content-Security-Policy" content="img-src https: data:">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Scaleforce</title>
    <link rel='stylesheet' type='text/css' href='main.css'>
</head>

<body>
    <div>
        <label for="txtSrc">Image:</label>
        <input type="text" id="txtSrc" value="image" placeholder="URI">
        <button id="loadButton">Load from URL</button>
        <input type="file" id="fileImg" accept="image/*,video/*">
    </div>
    <div>
        <input type="number" id="txtScale" value="2" min="1.0" max="10" step="0.5">
        <label for="txtScale">Scale</label>
        <input type="checkbox" id="enableScaleforce" checked>
        <label for="enableScaleforce">Enable Scaleforce</label>
        <input type="checkbox" id="enableFXAA">
        <label title="May reduce wavyness on edges" for="enableFXAA">Enable Modified FXAA Preprocessing</label>
    </div>
    <br>
    <div>
        <canvas id="board" width="1280" height="720">Oops!</canvas>
    </div>
    <video id="movOrig" autoplay loop preload="auto" crossorigin="anonymous">
        Oops!
    </video>
    <label id="speed"></label>
    <script src="../js/main.js"></script>
</body>

</html>
